name: "Automatic Production Deployment"

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_API: ${{ github.repository }}/etunda-api
  IMAGE_NAME_APP: ${{ github.repository }}/etunda-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: "Backend API"
            dockerfile: ./backend/Dockerfile
            image: etunda-api
            context: ./backend
          - name: "Frontend App"
            dockerfile: ./Dockerfile
            image: etunda-app
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-notifications:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: success()

    steps:
      - name: Deployment successful
        run: |
          echo "✓ Both images built and pushed to ghcr.io"
          echo "📦 API Image: ghcr.io/${{ github.repository }}/etunda-api:latest"
          echo "📦 App Image: ghcr.io/${{ github.repository }}/etunda-app:latest"
          echo ""
          echo "🚀 Deploy on Railway:"
          echo "   1. Go to Railway dashboard"
          echo "   2. Select your service"
          echo "   3. Go to Settings > Networking > Docker Image"
          echo "   4. Update to latest image from ghcr.io"
          echo "   5. Railway will redeploy automatically"
